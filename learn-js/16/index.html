    <script>
      const liEl = document.querySelector("#target");
      liEl.setAttribute("class", "big"); //기존의 있는 속성의 값을 덮어버림.
      liEl.classList.add("big"); //기본에 있는 속성 보존
      liEl.classList.toggle("red"); //있으면 빼고, 없으면 넣기.

      liEl.style.color = "red";
      liEl.style.textDecoration = "line-through";

      liEl.setAttribute("class", "big"); //("속성명", "바꿀 값")
      liEl.removeAttribute("style"); //("속성명")
